---
- name: Harden sshd (drop-in config)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: hardening)
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 3
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: ufw default policy deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: ufw default policy allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: ufw allow SSH only from admin CIDRs
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ item }}"
    comment: "SSH from admin"
  loop: "{{ ssh_allowed_cidrs }}"

- name: ufw allow published web ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
    comment: "published container port"
  loop: "{{ public_tcp_ports }}"

- name: Enable ufw (last, after allow rules)
  community.general.ufw:
    state: enabled
