---
- name: Remove conflicting distro packages
  ansible.builtin.apt:
    name: [docker.io, docker-doc, docker-compose, podman-docker, containerd, runc]
    state: absent

- name: Install prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3-debian]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker apt repository (deb822)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
  register: docker_repo

- name: Refresh apt cache after repo change
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Enable and start docker and containerd
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [docker, containerd]

- name: Add deployer to docker group
  ansible.builtin.user:
    name: "{{ deployer_user }}"
    groups: docker
    append: true
